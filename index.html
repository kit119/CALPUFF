function demoMovingRotated(){
path=[],points.map(a=>path.push({latLng:[a[2],a[1]],bearing:Math.random()*360}))
//icon=L.icon({iconUrl:"https://cdn-icons-png.flaticon.com/32/4712/4712109.png",iconSize:[32,32],iconAnchor:[16,32]})

function simulate() {duration=3000

  point=move.shift()
  m.slideTo(point.latLng,{duration:duration,rotationAngle:0})
  setTimeout(simulate,duration)
}
simulate()
}

function getPointInPoly(bound) { 
xmin  = bound.getEast()
xmax  = bound.getWest()
ymin  = bound.getSouth()
ymax  = bound.getNorth() 
lat   = ymin + (Math.random()*(ymax-ymin))
lng   = xmin + (Math.random()*(xmax-xmin))
point = turf.point([lng,lat])
poly  = paint.getData()
inside= turf.inside(point,poly)
if (inside) {return point.geometry.coordinates}
else {return getPointInPoly(bound)}
}

function poi(i,lo,la,note){
v=Math.round(60+Math.random()*60)
lo=parseFloat(lo.toFixed(6)),la=parseFloat(la.toFixed(6))
return [i,lo,la,v,0,note]
}

function getPoint(){
clearMap()
poly=paint.getData()
void 0===poly?b=map:b=L.geoJSON(poly);
b0=b.getBounds(),be=b0.getEast(),bw=b0.getWest(),bs=b0.getSouth(),bn=b0.getNorth(),c0=b0.getCenter()
points=[];//points.push(poi(1,c0.lng,c0.lat,'CT')),points.push(poi(2,be,bn,'NE')),points.push(poi(3,bw,bs,'SW')),points.push(poi(4,be,bs,'SE')),points.push(poi(5,bw,bn,'NW'))
for(i=1;i<=document.getElementById("colorClass").value;i++){
  void 0===poly?l=turf.randomPosition([bw,bs,be,bn]):l=getPointInPoly(b0);
  v=Math.round(60+Math.random()*60),l[0]=parseFloat(l[0].toFixed(6)),l[1]=parseFloat(l[1].toFixed(6))
  points.push([i,l[0],l[1],v,0,''])
}
Tabler()
}

function Intersection(base,over){ //unused
features = []; 
base.features.forEach(function(feature1) {
  over.features.forEach(function(feature2) {
    intersection = null;
    try {intersection = turf.intersect(feature1, feature2);} 
    catch (e) {
      try {
        feature1 = turf.buffer(feature1, 0);
        intersection = turf.intersect(feature1, feature2);
      } 
      catch (e) {intersection = feature1}
    }
    if (intersection != null) {
      intersection.properties = feature1.properties;
      intersection.id = (Math.random() * 100000).toFixed(0);
      features.push(intersection);
    }
  })
})

return turf.featureCollection(features);
}

bnd=L.geoJSON(markers).getBounds(), bNE=bnd._northEast, bSW=bnd._southWest

0===angle&&map.fitBounds(L.geoJSON(boundary).getBounds())

kriging_contours.features.map(e=>e.properties.z=e.properties.contour_value)

voronoi.features.map((n,i)=>{m=markers.features[i],n.properties.z=m.properties.z})

function htmlLoadFile() {
e = document.createElement('a'); 
e.innerHTML = '<input type="file">';
a = e.firstChild;
a.addEventListener('change', function() {
file = a.files[0];
if (file.name.match(/\.(txt|json|geojson)$/)) {
  reader = new FileReader();
  reader.readAsText(file,'utf-8'); 
  reader.onload = function(){
  data=JSON.parse(reader.result)
    markers={type:'FeatureCollection',features:[]}
    contours={type:'FeatureCollection',features:[]}
  data.features.forEach(function(a,i){
    if(i===0&&"MultiPolygon"===a.geometry.type) {paint.setData(a)}
    else if("Point"===a.geometry.type){markers.features.push(a)}
    else contours.features.push(a) 
  })
  clearMap()
  Contours = L.choropleth(contours, {valueProperty:'z',scale:colorScale,steps:colorSteps,mode:'e',style:styleOpt,onEachFeature:onEachFeatureContour,}).addTo(map)
  Markers = L.geoJSON(markers,{pointToLayer:pointToLayer,onEachFeature:onEachFeatureMarker}).addTo(map)
  map.fitBounds(Contours.getBounds())
  table.clearData()
  markers.features.forEach(a=>table.addData(a.properties))
}} 
else {$.notify("File not supported, .txt .json or .geojson files only")}
}); 
a.click();
}

function sactiModel(p1,p2,param){
sactiBuffer.remove(),sactiBuffer=L.layerGroup()
function sactiWork(d,a,i){if(a[0]<=5000){ // limit to 5 from 10km
  if(a[0]%1000==0){sactiBuffer.addLayer(L.geoJSON(turf.buffer(turf.point([p2,p1]),a[0]*.001),{style:{fillOpacity:0}}))}
  for(j=0;j<16;j++){ll=[p1,p2],r=(j*22.5)*(Math.PI/180),k=111000,n=(i*16)+(j+1),x=p2-a[0]*Math.sin(r)/k,y=p1-a[0]*Math.cos(r)/k,d.push([n,x,y,a[j+1]])}
}} //LMDCT,NDCT
points=[],sactiTable["LMDCT"][param].map((a,i)=>sactiWork(points,a,i))
clearMap(),Tabler(),map.closePopup()
setTimeout(function(){Interpolation(),Markers.remove()},500)
sactiBuffer.addTo(map)
//L.geoJSON(turf.buffer(turf.point([p2,p1]),1),{style:{fillOpacity:0}}).addTo(map)
}

///*** HYSPLIT ***///

function hysplitModel(p1,p2,param){
['Traj','Conc','Sulf','DepoGas','DepoPar','DepoAll','Anim'].map(a=>eval("hysplit"+a+".remove()"))
hysplitTraj = L.layerGroup()
icons={icon:L.icon.pulse({color:'white',iconSize:[10,10]})},icons=""
function linePop(w,h){return "<div id='container' style='width:"+w+"px;height:"+h+"px;margin:0 auto'>Loading...</div>"}
function lineOpt(c,s){return {color:c,weight:2,fillOpacity:0.5,dashArray:'4',dashSpeed:s}}
function mouse1(e){this.setStyle({weight:4,dashArray:'1'})}
function mouse2(e){this.setStyle({weight:2,dashArray:'3'})}
function popup3(e){color=this.options.color,"red"===color&&trajType(-1,"red"),"blue"===color&&trajType(1,"blue")}
function trajMouse(weight,dash){this.setStyle({weight:weight,dashArray:dash})}
function trajType(cat,col){ 
  for(categories=[],i=0;i<=24;i++){categories.push(cat*i+'h')}
  if(cat=-1){text='Backward Trajectory',series=hysp_track_back}
  if(cat=+1){text='Forward Trajectory',series=hysp_track_fwd}
return Highcharts.chart('container',{
  title:{text:text},subtitle:{text:null},credits:{enabled: false},
  xAxis:{crosshair:true,reversed:false,tickInterval:1,labels:{style:{fontSize:10}},categories:categories},
  yAxis:{title:{text:null},tickInterval:200,labels:{style:{fontSize:10}}},tooltip:{shared:true,valueSuffix:'m'},legend:{enabled:false},
  plotOptions:{series:{color:col,lineWidth:1,marker:{radius:2}}}, 
  series:series})
}
for(i=0;i<hysp_traj.length;i++) {i<=26?(c='blue',s=-10):(c='red',s=10);
  marker = L.marker(hysp_traj[0][0],icons)
  points = L.marker(hysp_traj[i][24],icons)
  liners = L.polyline(hysp_traj[i],lineOpt(c,s))
  liners.on({mouseover:mouse1,mouseout:mouse2,popupopen:popup3}),liners.bindPopup(linePop(320,240))
  hysplitTraj.addLayer(marker),hysplitTraj.addLayer(points),hysplitTraj.addLayer(liners)
} //hysplitTraj.addTo(map)

function getHex(brewer,range,value) {return chroma.scale(brewer).domain(range)(value).hex()}
function getOpt(color){return {color:color,weight:1,opacity:1,fillColor:color,fillOpacity:0.5,opacity:0.5}}
function mouse3(e){this.setStyle({fillOpacity:1.0})}
function mouse4(e){this.setStyle({fillOpacity:0.5})}

hysplitConc = L.layerGroup()
for (i=0;i<hysp_conc_part.length;i++) {a=0.02*0.5,p=hysp_conc_part[i],y=p[0],x=p[1],conc=p[2]*1e12; 
  color = getHex('Spectral',[1000,0],conc),rectangle = [[p[0]-a,p[1]-a],[p[0]+a,p[1]+a]]
  grid = L.rectangle(rectangle,getOpt(color))
  grid.on({mouseover:mouse3,mouseout:mouse4})
  grid.bindTooltip('<b>1 kMass</b> &rarr; ' + conc.toFixed(2) + ' <span>&#181;</span>Mass/m<sup>3</sup>')
  hysplitConc.addLayer(grid) 
} //hysplitConc.addTo(map)

hysplitSulf =  L.layerGroup()
for (i=0;i<hysp_sulfur.length;i++) {a=0.02*0.5,s=hysp_sulfur[i],so2=s[2]*0.453E8,so4=s[3]*1E9;
  color = getHex('YlOrRd',[0,1],so2),rectangle = [[s[0]-a,s[1]-a],[s[0]+a,s[1]+a]] 
  sox = L.rectangle(rectangle,getOpt(color))
  sox.on({mouseover:mouse3,mouseout:mouse4})
  sox.bindTooltip('<b>SO<sub>2</sub></b> [' + so2.toFixed(4) + ' ppb] &rarr; <b>SO<sub>4</sub><sup>2-</sub></b> [' + so4.toFixed(4) + ' <span>&#181;</span>g/m<sup>3</sup>]')
  hysplitSulf.addLayer(sox)
} //hysplitSulf.addTo(map)

hysplitDepoGas = L.geoJSON(hysp_dep_gas,{
  pointToLayer: function (features,latlng) {return null}, 
  style: function (features,layer) {return {color:features.properties.fill, weight:1}},
  onEachFeature: function (features, layer) { 
    layer.on({mouseover:function(){this.setStyle({weight:3})},mouseout:function(){this.setStyle({weight:1})} }),
    layer.bindTooltip('<b>Gas Deposition : <br></b>' + features.properties.name ) }, })
hysplitDepoPar = L.geoJSON(hysp_dep_par,{
  pointToLayer: function (features,latlng) {return null}, 
  style: function (features,layer) {return {color:'grey', weight:1}},
  onEachFeature: function (features, layer) { 
    layer.on({mouseover:function(){this.setStyle({weight:3})},mouseout:function(){this.setStyle({weight:1})} }),
    layer.bindTooltip('<b>Particle Deposition : <br></b>' + features.properties.name ) }, })
hysplitDepoAll = L.layerGroup([hysplitDepoGas,hysplitDepoPar])//.addTo(map)

eval("hysplit"+param+".addTo(map)")
map.closePopup()
}

hysplitAnim = L.canvasLayer().delegate(this);
function onDrawLayer(info) { 
ctx = info.canvas.getContext('2d');
setInterval(function() {
  ctx.clearRect(0,0,info.canvas.width,info.canvas.height); 
  m=new Date().getMinutes();
  s=new Date().getSeconds()*6;
for (h=0; h<24; h++) { s=s-15; 
if (m%2 == 0) { p=Math.floor(hysp_part.length/24)
  for (i=(p*h); i<(p*h+p); i++) { 
    d=hysp_part[i]
    dot=info.layer._map.latLngToContainerPoint([d[0],d[1]])
    ctx.beginPath() 
    ctx.arc(dot.x, dot.y,1,0,2*Math.PI) 
    ctx.closePath()
    ctx.fillStyle = 'hsla('+s+',100%,50%,0.5)' 
    ctx.fill() }}
if (m%2 == 1) { p=Math.floor(hysp_puff.length/24)
  for (i=(p*h); i<(p*h+p); i++) { 
    d=hysp_puff[i]  
    dot=info.layer._map.latLngToContainerPoint([d[0],d[1]])
    ctx.beginPath()
    ctx.arc(dot.x, dot.y,5*Math.random(),0,2*Math.PI)
    ctx.closePath()
    ctx.fillStyle = 'hsla('+s+',100%,50%,0.5)';
    ctx.fill() }}
} }, 5000) } //hysplitAnim.addTo(map);

</script>

<script>

//*** TMD HPC ***//
function colorMap(J,color,unit){
J.cellsize===void 0?(sx=J.dx,sy=J.dy):(sx=J.cellsize,sy=J.cellsize)
J=new L.ScalarField({ zs:J.zs, nCols:J.ncols, nRows:J.nrows, xllCorner:J.xllcorner, yllCorner:J.yllcorner, cellXSize:sx, cellYSize:sy})
return L.canvasLayer.scalarField(J, {type:"colormap", interpolate:true, color:chroma.scale(color).domain(J.range)}).setOpacity(0.75).on('click',function (v) {if(v.value!=null) {L.popup().setLatLng(v.latlng).setContent(v.value.toFixed(1)+unit).openOn(map)}})
}

function contourMap(J,color){
style={color:color, weight:2, fillOpacity:0.0, dashArray:'1'}
function onEachFeature(feature,layer){ a=feature.properties; layer.setText((a.aval*0.01).toString()) }
return L.geoJSON(J, {style:style, onEachFeature:onEachFeature})
}

function d1(arr,factor){
  if(factor=="UV"){ uv=arr[0],uv.us=[],uv.vs=[]
  for(i=0;i<uv.zs.length;i++){ mps=arr[0].zs[i]*0.0514444, zeta=arr[1].zs[i]*(Math.PI/180), uv.us.push(Math.cos(zeta)*mps), uv.vs.push(Math.sin(zeta)*mps)}
    arr=new L.VectorField({ us:uv.us, vs:uv.vs, nCols:uv.ncols, nRows:uv.nrows, xllCorner:uv.xllcorner, yllCorner:uv.yllcorner, cellXSize:uv.cellsize, cellYSize:uv.cellsize }) 
  }
  else { eval("arr.zs=arr.zs.map(x=>x"+factor+")") }
  return arr
}

function colorBar(Color, Domain, Range){
Options={position:"bottomleft",width:150,height:10,margin:15,background:"white",textColor:"black",steps:99,decimals:0,units:"",title:"",labelFontSize:12,labelTextPosition:"middle",labels:[Range[0],0.5*(Range[0]+Range[1]),Range[1]]}
return L.control.colorBar(chroma.scale(Color).domain(Domain), Range, Options)
}

function initTMD(){
TMD={MAP:["DSWR","PSFC","PCIP","RAIN","RHUM","TEMP","VECT","WIND"], CBAR: ["DSWR","PCIP","RAIN","RHUM","TEMP"], URL:'https://data.tmd.go.th/api/Weather3Hours/V2/?uid=api&ukey=api12345'}
TMD.MAP.map(a=>eval("TMD."+a+"=[]"));
TMD.CBAR.map(a=>eval("TMD.cbar"+a+"=[]"));
for(T=0;T<=48;T+=3){ TT="T"+T
  //T%24!=0&&eval("RAIN_"+TT+".zs=[]")
  //dswr=eval("DSWR_"+TT+".zs"), 0==dswr.reduce((a,b)=>a+ b,0)&&eval("(DSWR_"+TT+".zs=[])")
  //pcip=eval("PCIP_"+TT+".zs"), 0==pcip.reduce((a,b)=>a+ b,0)&&eval("(PCIP_"+TT+".zs=[])")
PSFC=contourMap(eval("PSFC_"+TT),"black") //PSFC=colorMap(d1(PSFC_T0,"*0.01"),kolor.BREWER.Purples,"mbar")
PCIP=colorMap(d1(eval("PCIP_"+TT),""),kolor.BREWER.Blues," ㎜"), cbarPCIP=colorBar(kolor.BREWER.Blues,PCIP._field.range,PCIP._field.range)
RAIN=colorMap(d1(eval("RAIN_"+TT),""),kolor.BREWER.Blues," ㎜"), cbarRAIN=colorBar(kolor.BREWER.Blues,RAIN._field.range,RAIN._field.range)
DSWR=colorMap(d1(eval("DSWR_"+TT),""),kolor.VIRIDIS.Inferno," W/m<sup>2</sup>"), cbarDSWR=colorBar(kolor.VIRIDIS.Inferno,DSWR._field.range,DSWR._field.range)
RHUM=colorMap(d1(eval("RHUM_"+TT),""),kolor.VIRIDIS.Viridis,"%"), cbarRHUM=colorBar(kolor.VIRIDIS.Viridis,RHUM._field.range,RHUM._field.range)
TEMP=colorMap(d1(eval("TEMP_"+TT),"-273.15"),kolor.VIRIDIS.Turbo,"℃"), cbarTEMP=colorBar(kolor.VIRIDIS.Turbo,TEMP._field.range,TEMP._field.range)
UV = d1([eval("WSPD_"+TT),eval("WDIR_"+TT)],"UV")
VECT =  L.canvasLayer.scalarField(UV.getScalarField('directionFrom'), { type: "vector", color:"white", vectworSize: 25, arrowDirection: "from" }).on('click',function(v) { a=v.value; if(a!=null) { b=Number(a)+180, b>=360&&(b-=360), L.popup().setLatLng(v.latlng).setContent(b.toFixed(0) + '°').openOn(map) } }).setOpacity(0.75)//.addTo(map)
WIND =  L.canvasLayer.vectorFieldAnim(UV,{color:"white", width: 2, velocityScale: 1/5000, paths: 1000, fade: 0.96, duration:20, maxAge: 200}).on('click',function(v) { a=v.value; if(a!=null) { L.popup().setLatLng(v.latlng).setContent(a.magnitude().toFixed(1) + ' m/s ' + a.directionTo().toFixed(0) + '°').openOn(map)}} ).setOpacity(0.75)//.addTo(map) //{color:"white", width:1, velocityScale: 1/5000, paths:800, fade: 0.96, duration:20, maxAge:200}
TMD.MAP.map(a=>eval( "TMD."+a+".push("+a+")" ));
TMD.CBAR.map(a=>eval( "TMD.cbar"+a+".push(cbar"+a+")" ))
}

controlSlider = L.control.slider(function(x) { x=parseInt(x)//TMD.cbar"+a+"[t].remove(),TMD.cbar"+a+"[x].addTo(map)
for(t=0;t<TMD.PSFC.length;t++){TMD.MAP.map(a=>eval("map.hasLayer(TMD."+a+"[t])&&( TMD."+a+"[t].remove(),TMD."+a+"[x].addTo(map) )"))}
for(t=0;t<TMD.PSFC.length;t++){TMD.CBAR.map(a=>eval("TMD.cbar"+a+"[t].remove(); if(map.hasLayer(TMD."+a+"[t]) && t==x){TMD.cbar"+a+"[x].addTo(map)}") )}
},
{title:'Slider', logo:"S", position:'bottomleft',orientation:'horizontal', increment:true, showValue:true, collapsed: true, value:0, step:1, min:0, max:16, width:'100px', size:'200px',
getValue:function(t) {return moment().startOf("day").add(t*3+7,"hours").add(-1,"day").add(543,"years").format("DD/MM/YY HH:mm")},
}).addTo(map) 
}
